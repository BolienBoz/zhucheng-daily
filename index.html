<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f58ca9">
  <meta name="description" content="築城事務所的離線日常收集遊戲">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="築城日常">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/brand-logo.svg?v=9" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png">
  <link rel="stylesheet" href="styles.css?v=28">
  <title>築城日常圖鑑</title>
</head>
<body>
  <div class="game-shell">
    <header class="topbar">
      <button class="brand" type="button" data-view="office" aria-label="回到事務所">
        <img src="assets/brand-logo.svg?v=9" alt="">
        <span><strong>築城日常</strong><small>事務所圖鑑</small></span>
      </button>
      <div class="day-status">
        <span>第 <strong id="day-number">1</strong> 天</span>
        <span class="action-pips" id="action-pips" aria-label="今日剩餘行動"></span>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="主要功能">
      <button type="button" data-view="office"><span>⌂</span>事務所</button>
      <button type="button" data-view="missions"><span>▤</span>任務</button>
      <button type="button" data-view="layout"><span>▦</span>布置</button>
      <button type="button" data-view="album"><span>✦</span>圖鑑 <b id="album-count">0</b></button>
    </nav>
  </div>

  <dialog id="mission-dialog" class="sheet" aria-labelledby="mission-title">
    <button class="sheet-close" type="button" data-close aria-label="關閉">×</button>
    <div id="mission-dialog-content"></div>
  </dialog>

  <dialog id="result-dialog" class="result-dialog">
    <div id="result-dialog-content"></div>
  </dialog>

  <dialog id="collection-dialog" class="collection-dialog">
    <button class="collection-close" type="button" data-close-collection aria-label="關閉收藏詳情">×</button>
    <div id="collection-dialog-content"></div>
  </dialog>

  <noscript>這個遊戲需要啟用 JavaScript 才能進行。</noscript>
  <script src="app.js?v=28" defer></script>
</body>
</html>
